<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Parlay...</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .btn { margin-top: 20px; padding: 12px 24px; background: #000; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Verifying your email...</h3>
    <p>If the app doesn't open automatically, click below:</p>
    <a id="deepLinkBtn" href="#" class="btn">Open App</a>

    <script>
        // 1. Get the secret params from the URL (sent by Appwrite)
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('userId');
        const secret = params.get('secret');

        // 2. Construct the Deep Link with the params
        // This MUST match the scheme in your app.json ("scheme": "parlay-app")
        const appUrl = `parlay-app://verify?userId=${userId}&secret=${secret}`;

        // 3. Set the button link (fallback)
        document.getElementById('deepLinkBtn').href = appUrl;

        // 4. Attempt Auto-Redirect
        if (userId && secret) {
            window.location.href = appUrl;
        } else {
            document.body.innerHTML = "<h3>Error: Invalid Verification Link</h3>";
        }
    </script>
</body>
</html>
